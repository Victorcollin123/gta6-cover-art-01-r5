<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leonida Nights — GTA 6 Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>Leonida Nights</h1>
    <p class="tag">Turn a photo and a caption into GTA 6-style cover art. Everything runs offline, in this page.</p>

    <label class="field">Photo
      <input id="photo" type="file" accept="image/*">
    </label>
    <div class="samples" aria-label="Sample photos">
      <span>Or try a sample:</span>
      <button type="button" data-sample="pier">Pier dusk</button>
      <button type="button" data-sample="boulevard">Boulevard</button>
    </div>

    <fieldset class="field" id="photo-tune">
      <legend>Photo position</legend>
      <label>Left / right <input id="photo-x" type="range" min="-1" max="1" step="0.05" value="0"> <output id="photo-x-value">0%</output></label>
      <label>Up / down <input id="photo-y" type="range" min="-1" max="1" step="0.05" value="0"> <output id="photo-y-value">0%</output></label>
      <label>Zoom <input id="photo-zoom" type="range" min="0.6" max="3" step="0.05" value="1"> <output id="photo-zoom-value">1.00x</output></label>
      <label>Rotate <input id="photo-rotate" type="range" min="-15" max="15" step="1" value="0"> <output id="photo-rotate-value">0°</output></label>
    </fieldset>

    <label class="field">Title
      <input id="title" type="text" maxlength="40" value="Sunset Heist">
    </label>
    <label class="field">Tagline
      <input id="tagline" type="text" maxlength="60" value="Vice City never sleeps">
    </label>

    <fieldset class="field" id="modes">
      <legend>Cover style</legend>
    </fieldset>

    <label class="field">Colour grade
      <select id="grade"></select>
    </label>
    <label class="field">Export size
      <select id="size">
        <option value="square">1080 × 1080 (square post)</option>
        <option value="portrait">1080 × 1350 (portrait post)</option>
        <option value="wide">1920 × 1080 (wide post)</option>
      </select>
    </label>

    <button id="export" type="button">Export PNG</button>
    <p id="status" role="status"></p>
  </section>
  <section class="preview" aria-label="Cover preview">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
